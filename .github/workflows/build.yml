name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Get the version from the tag
        id: version
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -match '^v?(\d+(\.\d+){0,3})') {
              $version = $Matches[1]
            }
          }
          echo "number=$version" >> $env:GITHUB_OUTPUT
          echo "Building version $version"

      - name: Build nutw.exe
        run: go build -trimpath -ldflags "-s -w" -o build\nutw.exe .\src

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.number }} `
            installer\nutw.iss

      - uses: actions/upload-artifact@v4
        with:
          name: nutw-install
          path: dist\nutw-install.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --title "Version ${{ steps.version.outputs.number }}" `
            --generate-notes `
            dist\nutw-install.exe
